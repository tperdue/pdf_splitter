[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-chapters"
version = "0.1.0"
description = "Split PDFs at embedded bookmark boundaries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]
ui = ["streamlit>=1.57,<2"]

[project.scripts]
pdf-chapters = "pdf_chapters.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
